<!doctype html>
<html lang="en" class="h-full bg-[#0d1117] text-[#c9d1d9]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local AI Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- TOP NAVIGATION BAR -->
    <header
      class="h-14 bg-[#161b22] border-b border-[#30363d] flex items-center justify-between px-4 shrink-0"
    >
      <div class="flex items-center space-x-6">
        <div class="flex items-center space-x-2 font-semibold text-white">
          <svg
            class="w-6 h-6 text-[#2ea043]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 10V3L4 14h7v7l9-11h-7z"
            />
          </svg>
          <span>Promxox Local AI</span>
        </div>

        <nav class="flex items-center space-x-1 text-sm">
          <a
            href="/"
            class="px-3 py-1.5 rounded-mg bg-[#21262d] text-white font-medium"
            >🏠 Chat</a
          >
          <a
            href="/search"
            class="px-3 py-1.5 rounded-mg text-[#8b949e] hover:text-[#c9d1d9] hover:bg-[#21262d]"
            >🔍 Qdrant Search</a
          >
          <a
            href="/submit"
            class="px-3 py-1.5 rounded-mg text-[#8b949e] hover:text-[#c9d1d9] hover:bg-[#21262d]"
            >📤 Submit Task</a
          >
          <a
            href="/index"
            class="px-3 py-1.5 rounded-mg text-[#8b949e] hover:text-[#c9d1d9] hover:bg-[#21262d]"
            >🛠️ Settings</a
          >
          <a
            href="/tools"
            class="px-3 py-1.5 rounded-mg text-[#8b949e] hover:text-[#c9d1d9] hover:bg-[#21262d]"
            >⚙️ Control Plane</a
          >
        </nav>
      </div>

      <div class="" flex items-center space-x-3>
        <span
          class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-[#238636]/20 text-[#3fb950] border border-[#238636]/40"
        >
          <span
            class="w-1.5 h-1.5 rounded-full bg-[#3fb950] mr-1.5 animate-pulse"
          ></span>
          Ollama Connected
        </span>
        <button
          onlick="logout()"
          class="text-xs text=[#8b949e] hover:text-white px-2 py-1 rounded border border-[#30363d] hover:bg=[#21262d]"
        >
          Logout
        </button>
      </div>
    </header>
    <!-- MAIN WORKSPACE -->
    <div class="flex-1 flex overflow-hidden">
      <!-- LEFT SIDEBAR (Controls & Meta)-->
      <aside
        class="w-64 bg-[#0d1117] border-r border-[#30363d] p-4 flex flex-col justify-between shrink-0"
      >
        <div class="space-y-4">
          <div>
            <label
              class="block text-xs font-semibold text-[#8b949e] uppercase tracking-wider mb-2"
              >Model</label
            >
            <select
              id="model-select"
              class="w-full bg-[#161b22] border border-[#30363d] rounded-md px-3 py-2 text-sm text-[#c9d1d9] focus:outline-none focus:border-[#58a6ff]"
            >
              <option value="llama3.2:3b">llama3.2:3b</option>
              <option value="mistral">mistral:latest</option>
              <option value="codellama">codellama:latest</option>
            </select>
          </div>

          <div class="" pt-4 border-t border-[#30363d]>
            <span
              class="block text-xs font-semibold text-[#8b949e] uppercase tracking-wider mb-2"
              >System Status</span
            >
            <div class="space-y-2 text-xs text-[#8b949e]">
              <div class="flex justify-between">
                <span>Inference Node:</span>
                <span class="text-[#c9d1d9] font-mono">Proxmox-LXC</span>
              </div>
              <div class="flex justify-between">
                <span>Vector DB:</span>
                <span class="text-[#3fb950]">Qdrant Ready</span>
              </div>
              <div class="flex justify-between">
                <span>Runtime:</span>
                <span class="text-[#c9d1d9] font-mono">Axum + Rust</span>
              </div>
            </div>
          </div>
        </div>
        <div
          class="text-xs text-[#8b949e] text-center border-t broder-[#30363d] pt-3"
        >
          Local Stack • Offline
        </div>
      </aside>

      <main class="flex-1 flex flex-col bg-[#0d117] overflow-hidden">
        <!-- Message Window -->
        <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-4">
          <!-- Assistant Welcome Bubble-->
          <div class="flex space-x-3 max-2-3xl">
            <div
              class="w-8 h-8 rounded-full bg-[#238636] flex items-center justify-center text-white tex-xs font-bold shrink-0"
            >
              AI
            </div>
            <div
              class="bg-[#161b22] border border-[#30363d] rounded-lg p-4 text-sm text-[#c9d1d9]"
            >
              <p>Read to assist. Connected to local Ollama runtime.</p>
            </div>
          </div>
        </div>
        <!-- INPUT PANEL -->
        <div class="p-4 border-t border-[#30363d] bg-[#161b22]">
          <div class="max-w-4xl mx-auto flex gap-2">
            <textarea
              id="user-input"
              rows="1"
              placeholder="Type a prompt or instruction for Ollama..."
              class="flex-1 bg=[#0d1117] border border-[#30363d] rounded-md px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-[#58a6ff] resize-none"
            ></textarea>
            <button
              onclick="sendMessage()"
              class="bg=[#238636] hover:bg-[#2ea043] text-white px-5 py-2.5 rounded-md font-medium text-sm transition-colors flex items-center justify-center shrink-0"
            >
              Send
            </button>
          </div>
        </div>

      </main>
    </div>

    <!-- CHAT HANDLER SCRIPT -->
     <script>
        async function sendMessage(){
            const input = document.getElementById("user-input");
            const chatWindow = document.getElementById("chat-window");
            const modelSelect = document.getElementById("model-select");
            const prompt = input.value.trim();

            if (!prompt) return;

            // Render User Message
            chatWindow.innerHTML += `
                <div class="flex space-x-3 max-w-3xl ml-auto justify-end">
                    <div class="bg-[#21262d] border border-[#30363d] rounded-lg p-4 text-sm text-[#c9d1d9]">
                        <p>${escapeHTML(prompt)}</p>
                    </div>
                </div>
            `;
            
            input.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Temporary Loading Indicator
            const loadingId = "loading-" + Date.now();
            chatWindow.innerHTML += `
                <div id="${loadingId}" class="flex space-x-3 max-w-3xl">
                    <div class="w-8 h-8 rounded-full bg-[#238636] flex items-center justify-center text-white teaxt-xs font-bold shrink-0">AI</div>
                    <div class="bg-[#161b22] border border-[#30363d] rounded-lg p-4 text-sm text-[#8b949e] animate-pulse">
                        Thinking...
                    </div>
                </div>
            `;
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try{
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type" : "application/json" },
                    body: JSON.stringify({
                        model:document.getElementById("model-select").value,
                        messages:[{ role: "user", content: prompt }],
                        stream: false
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                // Render Model Response
                chatWindow.innerHTML += `
                    <div id="${loadingId}" class="flex space-x-3 max-w-3xl">
                        <div class="w-8 h-8 rounded-full bg-[#238636] flex items-center justify-center text-white teaxt-xs font-bold shrink-0">AI</div>
                        <div class="bg-[#161b22] border border-[#30363d] rounded-lg p-4 text-sm text-[#c9d1d9]">
                            <span class="whitespace-pre-wrap">${escapeHTML(data.message.content)}</span>
                        </div>
                    </div>
                `;
            } catch (err) {
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();

                chatWindow.innerHTML += `
                    <div class+"p-3 bg-red-900/30 border border-red-500/50 rounded-md text-red-200 text-xs">
                        Failed to connect to local Ollama instance on port 11434.
                    </div>
                `;
            }

            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, match => ({
                '&': '&amp', '<': '&lt;', '>': '&gt', '"': '&quot', "'": '&#39;'
            }[match]));
        }

        function logout() {
            localStorage.removeItem("isLoggedIn");
            window.location.href = "/login";
        }
     </script>
  </body>
</html>
