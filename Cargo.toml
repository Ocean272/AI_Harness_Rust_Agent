[package]
name = "rust-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
imap = "3.0.0-alpha.15"
sqlx = { version = "0.7", features = [ "sqlite", "runtime-tokio-native-tls"]}
tokio = { version = "1", features = ["full"] }
tokio-native-tls = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
rig = { version = "0.38", default-features = false }
#rig = "0.38"
reqwest = { version = "0.11", features = ["json"] }
native-tls = "0.2"
dotenvy = "0.15.7"
uuid = { version = "1", features = ["v4", "fast-rng"] }
qdrant-client = "1.10"
anyhow = "1.0"
notify = "6.1"
mail-parser = "0.9"
axum = "0.7"
rusqlite = { version = "0.29", features = ["bundled"] }

[profile.dev]
debug = 0
codegen-units = 1
