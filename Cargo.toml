[package]
name = "rust-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
candle-core = "0.8.0"
candle-nn = "0.8.0"
chrono = "0.4"
dotenvy = "0.15.7"
futures-util = "0.3"
imap = "3.0.0-alpha.15"
mail-parser = "0.9"
native-tls = "0.2"
notify = "6.1"
qdrant-client = "1.10"
regex = "1.10"
reqwest = { version = "0.12", features = ["json"] }
rig = { version = "0.38", default-features = false }
#rig = "0.38"
rusqlite = { version = "0.32", features = ["bundled"] }
safetensors = "0.4.0"
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = [ "sqlite", "runtime-tokio-native-tls"]}
tracing = "0.1"
tokenizers = "0.19.0"
tokio = { version = "1", features = ["full"] }
tokio-native-tls = "0.3"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[profile.dev]
debug = 0
codegen-units = 1
